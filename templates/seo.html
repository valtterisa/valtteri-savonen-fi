{{define "seo-head"}}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{.SEO.Title}}</title>
{{if .SEO.Description}}<meta name="description" content="{{.SEO.Description}}" />{{end}}
{{if .SEO.Keywords}}<meta name="keywords" content="{{.SEO.Keywords}}" />{{end}}
<meta name="author" content="Valtteri Savonen" />
<meta name="robots" content="index, follow" />
<meta name="language" content="English" />
<meta name="revisit-after" content="7 days" />
<meta property="og:site_name" content="Valtteri Savonen" />
<meta property="og:title" content="{{.SEO.Title}}" />
{{if .SEO.Description}}<meta property="og:description" content="{{.SEO.Description}}" />{{end}}
<meta property="og:url" content="{{.SEO.URL}}" />
<meta property="og:type" content="{{.SEO.Type}}" />
<meta property="og:locale" content="en_US" />
<meta name="twitter:title" content="{{.SEO.Title}}" />
{{if .SEO.Description}}<meta name="twitter:description" content="{{.SEO.Description}}" />{{end}}
<meta name="twitter:creator" content="@valtterisavonen" />
<meta name="twitter:site" content="@valtterisavonen" />
{{if .SEO.Image}}
<meta property="og:image" content="{{.SEO.Image}}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{{.SEO.Title}}" />
<meta name="twitter:image" content="{{.SEO.Image}}" />
<meta name="twitter:card" content="summary_large_image" />
{{else}}
<meta name="twitter:card" content="summary" />
{{end}}
{{if .SEO.ArticlePublished}}
<meta property="article:published_time" content="{{.SEO.ArticlePublished}}" />
<meta property="article:author" content="{{.SEO.ArticleAuthor}}" />
{{end}}
{{if .SEO.Canonical}}<link rel="canonical" href="{{.SEO.Canonical}}" />{{end}}
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/css/output.css" />
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script>
  htmx.config.refreshOnHistoryMiss = true;
  function initContrib() {
    var el = document.querySelector('.contrib-scroll');
    var frame = document.querySelector('.contrib-frame');
    var tip = document.getElementById('contrib-tip');
    if (!el || el.dataset.ready) return;
    el.dataset.ready = '1';
    function syncFade() {
      if (!frame) return;
      var noScroll = el.scrollWidth <= el.clientWidth + 2;
      var atStart = noScroll || el.scrollLeft <= 2;
      var atEnd = noScroll || el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
      frame.classList.toggle('at-start', atStart);
      frame.classList.toggle('at-end', atEnd);
    }
    el.scrollLeft = el.scrollWidth;
    syncFade();
    el.addEventListener('wheel', function (e) {
      if (el.scrollWidth <= el.clientWidth) return;
      el.scrollLeft += e.deltaY + e.deltaX;
      e.preventDefault();
    }, { passive: false });
    el.addEventListener('mouseover', function (e) {
      var s = e.target.closest('[data-tip]');
      if (!s || !tip) return;
      var r = s.getBoundingClientRect();
      tip.textContent = s.getAttribute('data-tip');
      tip.style.left = (r.left + r.width / 2) + 'px';
      tip.style.top = r.top + 'px';
      tip.hidden = false;
    });
    el.addEventListener('mouseout', function (e) {
      if (!tip) return;
      if (e.relatedTarget && el.contains(e.relatedTarget)) return;
      tip.hidden = true;
    });
    el.addEventListener('scroll', function () {
      if (tip) tip.hidden = true;
      syncFade();
    });
  }
  function syncTabs(path, elt) {
    var tab = '';
    if (path && path.indexOf('/tabs/') !== -1) tab = path.split('/tabs/')[1];
    else if (elt) {
      var hxget = elt.getAttribute('hx-get') || '';
      if (hxget.indexOf('/tabs/') === 0) tab = hxget.replace('/tabs/', '');
    }
    if (!tab) return;
    tab = tab.split('?')[0];
    document.querySelectorAll('nav a[hx-get^="/tabs/"]').forEach(function (a) {
      var active = a.getAttribute('hx-get') === '/tabs/' + tab;
      a.className = 'pb-3 text-sm font-medium transition-colors' +
        (a.getAttribute('hx-get') === '/tabs/blog' ? ' inline-flex items-center gap-2' : '') +
        (active
          ? ' text-white border-b-2 border-white -mb-[2px]'
          : ' text-gray-500 hover:text-gray-300');
    });
  }
  document.addEventListener('DOMContentLoaded', initContrib);
  document.addEventListener('htmx:historyRestore', initContrib);
  document.addEventListener('htmx:afterSettle', function (e) {
    var path = (e.detail.pathInfo && e.detail.pathInfo.requestPath) || '';
    syncTabs(path, e.detail.elt);
  });
</script>
<script
  src="https://cdn.databuddy.cc/databuddy.js"
  async
  crossorigin="anonymous"
  data-client-id="gHCzLL73h4zbC94EXh5c1"
  data-track-interactions="true"
  data-track-bounce-rate="true"
  data-enable-batching="true"
></script>
{{if .SEO.JSONLD}}
<script type="application/ld+json">{{.SEO.JSONLD}}</script>
{{end}}
{{end}}
